<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Findex — Пошук документів</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#1e293b;background:#f1f5f9}body{max-width:900px;margin:60px auto;padding:0 20px}header{margin-bottom:32px}h1{font-size:42px;margin:0;color:#1d4ed8}p{line-height:1.6;color:#475569}form{display:flex;gap:12px;background:white;padding:15px;border-radius:16px;box-shadow:0 4px 20px #0001}input{flex:1;min-width:0;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:17px}button{border:0;border-radius:9px;padding:12px 20px;background:#2563eb;color:white;font-size:16px;cursor:pointer}.hit{background:white;margin:16px 0;padding:20px;border-radius:14px;box-shadow:0 3px 15px #0000000b}.hit a{font-weight:700;color:#1d4ed8;text-decoration:none;overflow-wrap:anywhere}.hit p{margin-bottom:0;overflow-wrap:anywhere}mark{background:#fef08a}#pager{display:flex;gap:12px;align-items:center;margin:20px 0}#pager button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:12px}small{color:#64748b}
</style></head><body><header><h1>⌕ Findex</h1><p>Пошукова система документів · Лабораторна робота №7</p></header><form id="form"><input id="q" placeholder="Що шукаємо?" required maxlength="300"><button>Знайти</button></form><p id="status">Введіть запит, щоб почати пошук.</p><main id="results"></main><div id="pager"></div><script>
let currentPage=1,currentQuery='';const results=document.querySelector('#results'),status=document.querySelector('#status'),pager=document.querySelector('#pager');
function highlight(text,q){const box=document.createElement('span');const words=q.toLowerCase().split(/\s+/).filter(Boolean);let i=0;for(const match of text.matchAll(/\S+|\s+/g)){const part=match[0];const node=words.some(w=>part.toLowerCase().includes(w))?document.createElement('mark'):document.createTextNode(part);if(node.nodeType===1)node.textContent=part;box.append(node)}return box}
async function search(page=1){currentPage=page;results.replaceChildren();pager.replaceChildren();status.textContent='Шукаємо…';try{const r=await fetch('/search?'+new URLSearchParams({q:currentQuery,k:'5',scorer:'bm25',page:String(page)}));if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();status.textContent=`Знайдено: ${data.total} · Сторінка ${page}`;for(const hit of data.results){const article=document.createElement('article');article.className='hit';const link=document.createElement('a');link.href='/docs/'+hit.doc_id;link.textContent=hit.filename;link.addEventListener('click',async e=>{e.preventDefault();const d=await fetch(link.href);if(!d.ok){alert('Документ недоступний');return}const doc=await d.json();results.replaceChildren();pager.replaceChildren();const back=document.createElement('button');back.textContent='← Назад до результатів';back.onclick=()=>search(currentPage);results.append(back);const title=document.createElement('h2');title.textContent=doc.filename;results.append(title);const pre=document.createElement('pre');pre.textContent=doc.text;results.append(pre);status.textContent='Перегляд документа №'+doc.doc_id});const score=document.createElement('small');score.textContent='Оцінка релевантності: '+hit.score.toFixed(3);const snippet=document.createElement('p');snippet.append(highlight(hit.snippet||'Сніпет відсутній',currentQuery));article.append(link,document.createElement('br'),score,snippet);results.append(article)}if(page>1){const b=document.createElement('button');b.textContent='← Попередня';b.onclick=()=>search(page-1);pager.append(b)}if(page*data.k<data.total){const b=document.createElement('button');b.textContent='Наступна →';b.onclick=()=>search(page+1);pager.append(b)}}catch(e){status.textContent='Не вдалося виконати пошук: '+e.message}}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();currentQuery=document.querySelector('#q').value.trim();if(currentQuery)search(1)});
</script></body></html>
